[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-data-lab"
version = "0.27.0"
description = "A provenance-first local archive and importer for personal data exports"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0,<2",
    "ruptures>=1.1,<2",
    "fastembed>=0.4,<0.5",
    "faster-whisper>=1.0,<2",
    "llama-cpp-python>=0.3,<0.4",
    "cryptography>=43,<44",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.9,<3",
    "python-dotenv>=1.0,<2",
    "sqlalchemy>=2.0,<3",
    "scikit-learn>=1.3,<2",
    "fastapi>=0.135,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[project.scripts]
personal-data-lab = "personal_data_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/personal-data-lab/migrations" = ["db/migrations/*.sql"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["integration: requires a disposable PostgreSQL database ending in _test"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# FastAPI declares parameters with Query()/Body() defaults by design.
"src/personal_data_lab/app/server.py" = ["B008"]
