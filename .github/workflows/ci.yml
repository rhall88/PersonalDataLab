name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_DB: personaldata_test
      POSTGRES_USER: personaldata_admin
      POSTGRES_PASSWORD: ci-only-not-a-secret
      DATABASE_URL: postgresql+psycopg://personaldata_admin:ci-only-not-a-secret@127.0.0.1:5432/personaldata_test
      TEST_DATABASE_URL: postgresql+psycopg://personaldata_admin:ci-only-not-a-secret@127.0.0.1:5432/personaldata_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Start PostgreSQL 18 and pgvector
        run: docker compose up -d --wait

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run unit and PostgreSQL integration tests
        run: pytest

      - name: Run Ruff
        run: ruff check .

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Check whitespace
        run: git diff --check

      - name: Show database logs after failure
        if: failure()
        run: docker compose logs db --no-color

      - name: Stop test services
        if: always()
        run: docker compose down --volumes
